[project]
name = "jd-screen"
version = "0.1.0"
description = "Bounded Spatial Canvas & Audit-Grounded Document Introspection Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "jinja2>=3.1.4",
    "pydantic>=2.9.0",
    "google-genai>=2.30.1",
    "pdfplumber>=0.11.4",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
